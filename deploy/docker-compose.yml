# The whole server: Minecraft plus the wly daemon beside it.
#
#   cp deploy/.env.example deploy/.env   # then fill it in
#   docker compose -f deploy/docker-compose.yml up -d
#
# The pack is not baked into the image. itzg fetches it from PACKWIZ_URL at
# start, honouring each entry's `side`, so a pack release needs no rebuild and
# no deploy, only a restart.

services:
  mc:
    # Pinned through a variable for the same reason WLY_IMAGE is: `java25` is a
    # MOVING tag and compose pulls before every up, so the JVM under the server
    # can change on a deploy that touched nothing. Roll back by putting a dated
    # tag in .env, no rebuild and no revert.
    image: "${MC_IMAGE:-itzg/minecraft-server:java25}"
    container_name: wly-mc
    restart: unless-stopped
    stdin_open: true
    tty: true

    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "1.21.1"
      FABRIC_LOADER_VERSION: "0.19.3"

      # Everything the server runs comes from here. Client-side entries are
      # skipped by packwiz, which is why the `side` invariant is enforced in CI.
      PACKWIZ_URL: "${PACKWIZ_URL:?set PACKWIZ_URL in deploy/.env}"

      MEMORY: "${MC_MEMORY:-6G}"

      # Java 25, not the 21 that 1.21.1 merely requires. C2ME's natives-math
      # module refuses to load on anything older, and compact object headers
      # (JEP 519) do not exist before 25, which is the largest memory lever
      # available to a heavily modded server and is measured in jvm-profiles.toml.
      #
      # Running an older pack on a newer JDK is a known flag, not a gamble:
      # sun.misc.Unsafe memory access warns on 24/25, denies on 26, and is gone
      # in 27. Permit it explicitly so the behaviour does not change under us
      # when the base image moves. JEP 472 likewise wants native access granted
      # rather than merely warned about.
      #
      # -Dspark.backgroundProfiler=false IS NOT OPTIONAL now that spark ships in
      # pack/stable. spark starts a BACKGROUND async-profiler on servers by
      # default, and its bundled async-profiler is 2.9 from 2022, which
      # segfaults the JVM on Java 25 at boot, on any architecture. That cost ten restart
      # loops on this box once already, and internal/bench/runner.go carries the
      # same flag for the same reason: the bench harness and the live server
      # must not run spark differently, or the numbers measure a server nobody
      # plays on.
      #
      # Disabling it leaves `/spark tps` working, because tick timing comes from
      # spark's own hook and never touches the native agent. That is the whole
      # reason spark is here: it is the only thing on this server that can
      # answer for TPS and MSPT, and until it landed the status board showed
      # measured RCON response time instead rather than invent them.
      JVM_OPTS: >-
        --sun-misc-unsafe-memory-access=allow
        --enable-native-access=ALL-UNNAMED
        --illegal-native-access=allow
        -Dspark.backgroundProfiler=false
        ${MC_JVM_OPTS:-}
      # G1 with Aikar's tuning is the right default under a 16G heap. Any other
      # profile is JVM_XX_OPTS, never a code change, see BENCHMARKS.md.
      USE_AIKAR_FLAGS: "true"
      # Baseline from brucethemoose/Minecraft-Performance-Flags-Benchmarks, on
      # top of Aikar's G1 tuning above. Every flag here was preflighted against
      # this exact image with `java <flag> -version` on aarch64 rather than
      # copied on faith, the guide is four years old and several of its flags
      # target JDKs and CPUs that have moved on.
      #
      # Dropped from the published set: -XX:+UseNUMA, which fails to initialise
      # libnuma on a single-node VM and warns on every boot for no benefit.
      #
      # UseCompactObjectHeaders is the one genuinely new lever (JEP 519,
      # production in 25): 8-byte headers instead of 12/16. It matters most
      # exactly here, where there are 2 cores to collect with and heap pressure
      # is the binding constraint. It is still the first thing to A/B in
      # jvm-profiles.toml, shipped on because it is a supported production
      # feature, not because it has been measured on this pack.
      JVM_XX_OPTS: >-
        -XX:+UnlockExperimentalVMOptions
        -XX:+UnlockDiagnosticVMOptions
        -XX:+AlwaysActAsServerClassMachine
        -XX:+AlwaysPreTouch
        -XX:+DisableExplicitGC
        -XX:+PerfDisableSharedMem
        -XX:+UseFastUnorderedTimeStamps
        -XX:+UseCriticalJavaThreadPriority
        -XX:ThreadPriorityPolicy=1
        -XX:AllocatePrefetchStyle=3
        -XX:+UseVectorCmov
        -XX:NmethodSweepActivity=1
        -XX:ReservedCodeCacheSize=400M
        -XX:+UseCompactObjectHeaders
        ${MC_JVM_XX_OPTS:-}

      # Two cores. This is the cheapest TPS lever on this hardware and it sat at
      # itzg's 10/10 default while fifteen JVM flags were argued line by line
      # above it. Simulation distance is the expensive one: it sets how far
      # entities, block entities and redstone actually tick, and the `explore`
      # workload showed travel saturating both cores at 65ms p95. View distance
      # only streams chunks to clients, so it can stay a notch higher.
      # Raise these only against a measured row, never because they feel small.
      VIEW_DISTANCE: "${MC_VIEW_DISTANCE:-8}"
      SIMULATION_DISTANCE: "${MC_SIMULATION_DISTANCE:-6}"

      # Every deploy used to drop players mid-sentence. 30s and a countdown in
      # chat, well inside the 120s stop grace period below.
      STOP_SERVER_ANNOUNCE_DELAY: "30"

      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in deploy/.env}"
      ONLINE_MODE: "true"
      ENFORCE_WHITELIST: "true"

      # Two lines, because the server list gives you two and wasting one is a
      # missed hello. Section signs are colour codes; the file is UTF-8 so the
      # emoji survive. Single-quoted YAML so the escape stays two literal
      # characters rather than becoming a real newline compose folds away.
      # FALLBACK ONLY. MiniMOTD is in pack/stable (side "server") and takes
      # over on every ping, which is what makes the second line rotate.
      # Vanilla reads server.properties once at boot and has no runtime
      # setter, so a rotating MOTD is impossible without something answering
      # the ping. This stays correct rather than being deleted, because it is
      # what shows if MiniMOTD ever fails to load.
      MOTD: '§d§lwly §d♥§r  §8│ §7fabric 1.21.1\n§7terralith §8· §7oritech §8· §8§obring a shovel'

      # Seeds only. EXISTING_WHITELIST_FILE is deliberately left at itzg's
      # default of SKIP rather than SYNCHRONIZE: with SYNCHRONIZE the env var
      # becomes authoritative and every restart discards names added at runtime
      #, which would silently break the `/whitelist add` Discord command in
      # phase 5, and lose anyone invited between deploys. So this seeds the file
      # once and RCON owns it thereafter.
      WHITELIST: "${MC_WHITELIST:-}"
      OPS: "${MC_OPS:-}"

      # Watchdog stays on: this server is always-on and does not use autopause,
      # so a hung tick should kill the process rather than hang the players.
      OVERRIDE_SERVER_PROPERTIES: "true"

    ports:
      - "25565:25565"
      # simple-voice-chat is UDP and nothing published UDP at all, so it failed
      # with no server-side error, which is why nobody noticed. A port with no
      # protocol suffix is TCP only. The mod IS in pack/stable, side "both"
      # (checked 2026-08-23), and the pack ships no config, so the server wrote
      # the mod's own default of 24454. Confirm that in
      # config/voicechat/voicechat-server.properties on the box before the
      # restart: `port = -1` there means "reuse the game port", which would need
      # 25565/udp published instead of this line.
      - "24454:24454/udp"
      # squaremap's own webserver. The mod landed in pack/stable v0.1.7,
      # side "server"; before that this line was deliberately absent, because
      # publishing a port to a mod that is not installed binds a socket to
      # nothing and adds it to the box's ports baseline for no service.
      # 8080 inside is squaremap's default and 8080 on the host is dozzle,
      # hence the shift. Verified on the box 2026-08-23: the mod writes
      # /data/squaremap/config.yml (NOT config/squaremap/, which is where every
      # other mod puts its config) with internal-webserver enabled, bind
      # 0.0.0.0, port 8080, and serves 200 through this mapping.
      - "${MC_MAP_PORT:-8123}:8080"
      # RCON is loopback only. It is an admin channel with a shared password;
      # wly reaches it over the compose network, nothing else should.
      - "127.0.0.1:25575:25575"

    volumes:
      - mc-data:/data

    stop_grace_period: 120s   # a large modded world takes real time to save

    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m        # first boot downloads the whole pack

    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  wly:
    image: "${WLY_IMAGE:-ghcr.io/6586x57890143/weloveyou.mc:latest}"
    container_name: wly
    restart: unless-stopped
    # Opt-in. `wly serve` is real now: it runs the log bridge, the status board
    # and the spend post. It stays behind a profile because it needs
    # WLY_DISCORD_TOKEN and a reconciled guild, and a box that has neither must
    # still be able to run Minecraft. Start it with:
    #   docker compose --profile bot up -d
    profiles: ["bot"]
    # service_started, not service_healthy. `compose up -d` blocks on a
    # service_healthy dependency, and mc's healthcheck has a 5 minute start
    # period while it downloads the pack, which would stall every deploy behind
    # it and fail the run outright on a cold first boot. wly retries RCON anyway,
    # so it does not need mc to be ready, only to exist.
    depends_on:
      mc:
        condition: service_started
      docker-proxy:
        condition: service_started

    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,mode=1777

    environment:
      WLY_CONFIG: /config/wly.toml
      WLY_RCON_PASSWORD: "${RCON_PASSWORD:?}"
      WLY_DISCORD_TOKEN: "${WLY_DISCORD_TOKEN:-}"
      # The spend surface escalates against this, matching cost-push.sh on the
      # box so two things reporting the same numbers cannot use different
      # thresholds.
      WLY_COST_BUDGET: "${WLY_COST_BUDGET:-5}"
      # Read-only container inspection, through the proxy below and never
      # through the host socket. Unset means uptime is simply unavailable and
      # the status board shows none rather than inventing one.
      DOCKER_HOST: "tcp://docker-proxy:2375"
      # REMOVED: WLY_R2_ACCESS_KEY and WLY_R2_SECRET_KEY. CLAUDE.md records that
      # R2 was superseded (commit c98aefb) and that these still passed through
      # compose with nothing consuming them. A secret plumbed into a container
      # that has no use for it is blast radius for free.

    volumes:
      - ../wly.toml:/config/wly.toml:ro
      # Read-only: wly tails latest.log, reads world/stats for first-join and
      # the leaderboards, and reads squaremap's tiles. It has no business
      # writing into the server's data directory, and the log bridge is the
      # component most exposed to input nobody here controls.
      - mc-data:/mc:ro
      # The cost report, written on the HOST by the wly-cost timer. It was
      # never mounted, so the spend surface read /var/lib/wly/cost.json inside
      # the container, found nothing, and would have reported "no cost report on
      # the box at all" forever while the box had one all along.
      - /var/lib/wly:/var/lib/wly:ro
      # REMOVED 2026-08-24, security review. This was
      #   - /var/run/docker.sock:/var/run/docker.sock
      # for lifecycle control: wly speaks the Docker Engine API over the socket
      # directly, the image being distroless with no docker CLI to shell out to.
      #
      # The socket is host-root-equivalent, which makes read_only, cap_drop and
      # no-new-privileges above decorative: anything that reaches the Docker API
      # can start a privileged container and mount the host. No Go code uses it
      # yet - restart/stop/inspect are still unwritten - so today it bought
      # nothing and risked everything, and it would have been mounted for the
      # first time under a daemon parsing Discord input from the internet.
      #
      # When that code lands it points at a socket proxy on the compose network,
      # not at this file:
      #
      #   docker-proxy:
      #     image: tecnativa/docker-socket-proxy
      #     environment: { CONTAINERS: 1, POST: 1 }
      #     volumes: [ /var/run/docker.sock:/var/run/docker.sock:ro ]
      #
      # and wly gets DOCKER_HOST=tcp://docker-proxy:2375. That keeps the design
      # (three endpoints over HTTP) and makes the forty-line scope enforced by
      # something other than a comment.

    mem_limit: 512m
    pids_limit: 128

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Read-only Docker API, for one fact: when the Minecraft container started.
  #
  # The status board says "up <relative time>" and nothing else can answer it.
  # The log's own "Done (12.345s)!" line carries NO DATE, only a wall clock, so
  # anything derived from it is wrong across midnight, and the daemon usually
  # starts long after the server and never sees that line at all.
  #
  # CLAUDE.md's security review (2026-08-24) removed the host socket bind mount
  # from the wly service and said the replacement would be this proxy with
  # CONTAINERS=1, POST=1. THIS GOES FURTHER: POST is off. Nothing wly does today
  # creates, starts, stops or kills anything, so the proxy refuses all of it and
  # a bug in the daemon parsing Discord input off the internet can read a
  # container list and nothing else. Lifecycle control is a later phase and can
  # raise this deliberately rather than inherit a permission nobody asked for.
  #
  # The proxy is the only thing that touches docker.sock, it takes it READ-ONLY,
  # and it publishes no port: it is reachable on the compose network alone.
  docker-proxy:
    image: "${DOCKER_PROXY_IMAGE:-tecnativa/docker-socket-proxy:0.3.0}"
    container_name: wly-docker-proxy
    restart: unless-stopped
    profiles: ["bot"]
    environment:
      # Allow: inspect a container. Everything else is denied by default and
      # the dangerous verbs are denied explicitly, so a future image default
      # cannot quietly widen this.
      CONTAINERS: "1"
      POST: "0"
      EXEC: "0"
      IMAGES: "0"
      VOLUMES: "0"
      NETWORKS: "0"
      SERVICES: "0"
      TASKS: "0"
      SECRETS: "0"
      CONFIGS: "0"
      NODES: "0"
      SWARM: "0"
      SYSTEM: "0"
      INFO: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      DISTRIBUTION: "0"
      PLUGINS: "0"
      SESSION: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 32
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # The database. It holds exactly one fact that has no other home: which
  # Minecraft account belongs to which Discord account. Everything else wly
  # surfaces already has an authoritative source (the world's own stats files,
  # RCON, pack.toml, cost.json) and is deliberately NOT copied in here.
  #
  # 17-alpine, pinned to a major rather than a moving tag, for the same reason
  # MC_IMAGE is pinned: compose pulls before every up, and a database that
  # changes major version under itself on a deploy that touched nothing is a
  # bad afternoon.
  #
  # No published port. Nothing outside this compose network has any business
  # reaching it, and the box's ports baseline would flag it if it did.
  db:
    image: "${DB_IMAGE:-postgres:17-alpine}"
    container_name: wly-db
    restart: unless-stopped
    # Behind the same profile as wly, and for the same reason. Nothing consumes
    # this database until the bot exists, and POSTGRES_PASSWORD is required
    # rather than defaulted, so leaving it in the default set made `compose up`
    # fail on every box that had not set DB_PASSWORD yet. A service that is not
    # used yet must not be able to break a deploy that does not use it.
    #
    #   docker compose --profile bot up -d
    profiles: ["bot"]
    environment:
      POSTGRES_DB: "${DB_NAME:-wly}"
      POSTGRES_USER: "${DB_USER:-wly}"
      # NOT `:?`. Compose interpolates every service in the file regardless of
      # profile, so a required variable here failed `compose up` for anyone who
      # had not set it, including a box that only runs Minecraft. The postgres
      # image already refuses to initialise without a password and says exactly
      # that, so the enforcement is kept and the collateral damage is not.
      POSTGRES_PASSWORD: "${DB_PASSWORD:-}"
      # Postgres is happy to fsync less on a hobby box, but this is player
      # identity rather than a cache, so it keeps its defaults.
    volumes:
      - db-data:/var/lib/postgresql/data
      # Applied on FIRST START ONLY, when the data directory is empty. An edit
      # to schema.sql does not migrate an existing database, which is a real
      # trap: it looks applied and is not.
      - ./schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wly} -d ${DB_NAME:-wly}"]
      interval: 20s
      timeout: 5s
      retries: 5
    # 2 cores and 11G total, most of it already spoken for by a 6G heap. This
    # is a database for a few dozen rows, so it is capped rather than left to
    # decide for itself how much shared memory it deserves.
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  mc-data:
  # NOT covered by deploy/backup.sh, which archives the Minecraft world only.
  # Losing this means everyone re-links, which is annoying rather than fatal,
  # but it wants a pg_dump beside the world tar before anything depends on it.
  db-data:

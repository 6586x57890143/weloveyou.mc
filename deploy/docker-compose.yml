# The whole server: Minecraft plus the wly daemon beside it.
#
#   cp deploy/.env.example deploy/.env   # then fill it in
#   docker compose -f deploy/docker-compose.yml up -d
#
# The pack is not baked into the image. itzg fetches it from PACKWIZ_URL at
# start, honouring each entry's `side`, so a pack release needs no rebuild and
# no deploy — only a restart.

services:
  mc:
    image: itzg/minecraft-server:java25
    container_name: wly-mc
    restart: unless-stopped
    stdin_open: true
    tty: true

    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "1.21.1"
      FABRIC_LOADER_VERSION: "0.19.3"

      # Everything the server runs comes from here. Client-side entries are
      # skipped by packwiz, which is why the `side` invariant is enforced in CI.
      PACKWIZ_URL: "${PACKWIZ_URL:?set PACKWIZ_URL in deploy/.env}"

      MEMORY: "${MC_MEMORY:-6G}"

      # Java 25, not the 21 that 1.21.1 merely requires. C2ME's natives-math
      # module refuses to load on anything older, and compact object headers
      # (JEP 519) do not exist before 25 — which is the largest memory lever
      # available to a heavily modded server and is measured in jvm-profiles.toml.
      #
      # Running an older pack on a newer JDK is a known flag, not a gamble:
      # sun.misc.Unsafe memory access warns on 24/25, denies on 26, and is gone
      # in 27. Permit it explicitly so the behaviour does not change under us
      # when the base image moves. JEP 472 likewise wants native access granted
      # rather than merely warned about.
      JVM_OPTS: >-
        --sun-misc-unsafe-memory-access=allow
        --enable-native-access=ALL-UNNAMED
        --illegal-native-access=allow
        ${MC_JVM_OPTS:-}
      # G1 with Aikar's tuning is the right default under a 16G heap. Any other
      # profile is JVM_XX_OPTS, never a code change — see BENCHMARKS.md.
      USE_AIKAR_FLAGS: "true"
      # Baseline from brucethemoose/Minecraft-Performance-Flags-Benchmarks, on
      # top of Aikar's G1 tuning above. Every flag here was preflighted against
      # this exact image with `java <flag> -version` on aarch64 rather than
      # copied on faith — the guide is four years old and several of its flags
      # target JDKs and CPUs that have moved on.
      #
      # Dropped from the published set: -XX:+UseNUMA, which fails to initialise
      # libnuma on a single-node VM and warns on every boot for no benefit.
      #
      # UseCompactObjectHeaders is the one genuinely new lever (JEP 519,
      # production in 25): 8-byte headers instead of 12/16. It matters most
      # exactly here, where there are 2 cores to collect with and heap pressure
      # is the binding constraint. It is still the first thing to A/B in
      # jvm-profiles.toml — shipped on because it is a supported production
      # feature, not because it has been measured on this pack.
      JVM_XX_OPTS: >-
        -XX:+UnlockExperimentalVMOptions
        -XX:+UnlockDiagnosticVMOptions
        -XX:+AlwaysActAsServerClassMachine
        -XX:+AlwaysPreTouch
        -XX:+DisableExplicitGC
        -XX:+PerfDisableSharedMem
        -XX:+UseFastUnorderedTimeStamps
        -XX:+UseCriticalJavaThreadPriority
        -XX:ThreadPriorityPolicy=1
        -XX:AllocatePrefetchStyle=3
        -XX:+UseVectorCmov
        -XX:NmethodSweepActivity=1
        -XX:ReservedCodeCacheSize=400M
        -XX:+UseCompactObjectHeaders
        ${MC_JVM_XX_OPTS:-}

      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in deploy/.env}"
      ONLINE_MODE: "true"
      ENFORCE_WHITELIST: "true"

      # Two lines, because the server list gives you two and wasting one is a
      # missed hello. Section signs are colour codes; the file is UTF-8 so the
      # emoji survive. Single-quoted YAML so the escape stays two literal
      # characters rather than becoming a real newline compose folds away.
      MOTD: '§d§l♥ we§f§llove§d§lyou §d♥  §8│ §7Fabric 1.21.1\n§7Terralith §8· §7Oritech §8· §8§obring a shovel'

      # Seeds only. EXISTING_WHITELIST_FILE is deliberately left at itzg's
      # default of SKIP rather than SYNCHRONIZE: with SYNCHRONIZE the env var
      # becomes authoritative and every restart discards names added at runtime
      # — which would silently break the `/whitelist add` Discord command in
      # phase 5, and lose anyone invited between deploys. So this seeds the file
      # once and RCON owns it thereafter.
      WHITELIST: "${MC_WHITELIST:-}"
      OPS: "${MC_OPS:-}"

      # Watchdog stays on: this server is always-on and does not use autopause,
      # so a hung tick should kill the process rather than hang the players.
      OVERRIDE_SERVER_PROPERTIES: "true"

    ports:
      - "25565:25565"
      # RCON is loopback only. It is an admin channel with a shared password;
      # wly reaches it over the compose network, nothing else should.
      - "127.0.0.1:25575:25575"

    volumes:
      - mc-data:/data

    stop_grace_period: 120s   # a large modded world takes real time to save

    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m        # first boot downloads the whole pack

    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  wly:
    image: "${WLY_IMAGE:-ghcr.io/6586x57890143/weloveyou.mc:latest}"
    container_name: wly
    restart: unless-stopped
    # Opt-in until the daemon does something. `wly serve` is a phase-0 skeleton
    # that exits immediately, so starting it by default would just restart-loop
    # and make every deploy look broken. Start it with:
    #   docker compose --profile bot up -d
    profiles: ["bot"]
    # service_started, not service_healthy. `compose up -d` blocks on a
    # service_healthy dependency, and mc's healthcheck has a 5 minute start
    # period while it downloads the pack — which would stall every deploy behind
    # it and fail the run outright on a cold first boot. wly retries RCON anyway,
    # so it does not need mc to be ready, only to exist.
    depends_on:
      mc:
        condition: service_started

    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,mode=1777

    environment:
      WLY_CONFIG: /config/wly.toml
      WLY_RCON_PASSWORD: "${RCON_PASSWORD:?}"
      WLY_DISCORD_TOKEN: "${WLY_DISCORD_TOKEN:-}"
      WLY_R2_ACCESS_KEY: "${WLY_R2_ACCESS_KEY:-}"
      WLY_R2_SECRET_KEY: "${WLY_R2_SECRET_KEY:-}"

    volumes:
      - ../wly.toml:/config/wly.toml:ro
      # Read-only: wly tails latest.log and reads squaremap's tiles. It has no
      # business writing into the server's data directory.
      - mc-data:/mc:ro
      # Lifecycle control. wly speaks the Docker Engine API over this socket
      # directly — the image is distroless and has no docker CLI to shell out to.
      - /var/run/docker.sock:/var/run/docker.sock

    mem_limit: 512m
    pids_limit: 128

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  mc-data:

visible_to = ["supporter"]

[[channels]]
id = "1541487319826047026"
name = "🔧│ops"
category = "ops"
topic = "spend, health, backups. wly talks to itself in here."
surface = "spend"
visible_to = ["admin"]

# ---------------------------------------------------------------------------
# Custom emoji. The square 8x8 icons in scripts/pixelicons.py, uploaded so the
# surfaces can use them inline as <:name:id>.
#
# Discord cannot render SVG in a message, so this is the only way those icons
# reach a player. Uploads are 128x128 and 256 KiB max, which an 8x8 grid scaled
# with nearest-neighbour clears by a mile. Managing them needs
# CREATE_GUILD_EXPRESSIONS on the bot.
# ---------------------------------------------------------------------------

[emojis]
source = "scripts/pixelicons.py"
upload = ["heart", "shovel", "map", "coin", "skull", "player", "villager", "machines", "world"]

# ---------------------------------------------------------------------------
# Interactions, and the deliberate absence of commands.
#
# A REGULAR PLAYER TYPES NOTHING. No slash commands at all: the one thing a
# newcomer has to do is press a button on the pinned card in #start-here, and
# everything else is a surface they read. A command surface is a thing to
# discover, remember and get wrong, and a server whose onboarding is "type this
# exactly" loses people at exactly the point it can least afford to.
#
# Admin commands, when they land, get `default_member_permissions` so Discord
# does not even show them in the picker to anyone without the permission. That
# is the mechanism for keeping the surface low: not documentation asking people
# to ignore things, but Discord hiding them.
#
# Every custom_id a surface uses must be declared here. An undeclared one is a
# button that does nothing when pressed, which is worse than an absent one
# because a player has already committed to it. scripts/discord-mocks.py
# enforces this.
# ---------------------------------------------------------------------------

[interactions]
buttons = [
    "link_start",   # opens the modal that asks for a Minecraft name
]
modals = [
    "link_submit",  # the name comes back, we resolve it and open a request
]

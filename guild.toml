# The Discord server, declared. `wly guild plan` diffs this against reality and
# `wly guild apply` makes reality match. The layout becomes a reviewable diff,
# the same way jvm-profiles.toml and docker-compose.yml already are.
#
# Roles and channels are ARRAYS OF TABLES, not named tables, because order is
# meaning here and a named table lands in a Go│map, which has none. Role order
# is the hierarchy, highest first. Channel order is display order in its
# category. The first version of this file said "order here is the hierarchy"
# while parsing into something that could not preserve it.
#
# Three rules the reconciler encodes, each of which is a way to lose data:
#
#   1. A bot can only manage roles STRICTLY BELOW its own highest role. The wly
#      role goes at the top of the server's role list and nothing declared here
#      may outrank it. `plan` REFUSES to run when it finds one that does, rather
#      than emitting changes that would silently no-op.
#   2. APPLY NEVER DELETES. A channel or role present on the server and absent
#      here is reported as drift and left alone. Removing it is `--prune`, typed
#      by a human who read the plan. Destroying a channel of history to satisfy
#      a config file is the 3am page.
#   3. Gradients are not always available. `colors` needs the ENHANCED_ROLE_COLORS
#      guild feature, which is boost-gated. Every role also declares a flat
#      `color`, and the reconciler downgrades rather than failing when the
#      feature is absent.

[guild]
name = "wly"
# Reconciliation refuses to touch a guild whose id does not match, so a token
# pointed at the wrong server cannot rewrite it. Empty means "refuse everything".
id = "1540075305652199514"

# ---------------------------------------------------------------------------
# Roles, highest first. wly's own role is not declared here: Discord creates it
# when the bot joins, and it must sit above every one of these.
# ---------------------------------------------------------------------------

[[roles]]
name = "admin"
color = "#C4705C"
hoist = true
permissions = ["Administrator"]
# Declared so drift reports name it, never edited by the reconciler. A config
# file is the wrong place to be the authority on who is an administrator.
manual = true

[[roles]]
name = "supporter"
# The one gradient the palette earns: heart into the warning gold. Supporters
# are the only hoisted cosmetic role, which is most of the perk.
color = "#E39AAE"
colors = { primary = "#E39AAE", secondary = "#D8A657" }
hoist = true
mentionable = false
granted_by = "entitlement"      # the payment rail, via the Worker and KV

[[roles]]
name = "day-one"
color = "#D8A657"
granted_by = "linked_role"
metadata_key = "first_joined"

[[roles]]
name = "deathless"
# Costs nothing, means something, and is lost the moment you die. The cheapest
#│status perk there is.
color = "#8FA860"
granted_by = "linked_role"
metadata_key = "deaths"

[[roles]]
name = "rooted"
color = "#84A69C"
granted_by = "linked_role"
metadata_key = "playtime_hours"
threshold = 100

[[roles]]
name = "settled"
color = "#84A69C"
granted_by = "linked_role"
metadata_key = "playtime_hours"
threshold = 10

[[roles]]
name = "player"
# Whitelisted AND has actually connected. Gates the in-game channels, so a
# lurker sees the door and not the room.
color = "#8E8677"
granted_by = "linked_role"
metadata_key = "has_joined"

# ---------------------------------------------------------------------------
# Channels, in display order within each category. `surface` names the pinned
# message wly owns and edits in place; a channel with one is wly's to write in.
#
# `id` is the Discord channel id and it is what makes the name editable. Match
# on the name alone and renaming one here reads as "create a second channel and
# abandon the first", which destroys a channel of history without ever issuing a
# delete. With the id, a rename is an `update channel` line in the plan. A new
# channel has no id yet; apply prints the one it just created so it can be
# pasted back in here.
#
# Each name is an emoji, a BRAILLE PATTERN BLANK (U+2800), then the name. The
# emoji is the convention for this server: one per channel, fitting, never
# decorative.
#
# The separator is U+2502 BOX DRAWINGS LIGHT VERTICAL, and it is VISIBLE on
# purpose, because a blank one is not available. That is a measurement, not a
# preference:
#
#   U+00A0 non-breaking space   -> rewritten to a hyphen
#   U+2800 braille blank        -> stripped
#   U+3164 hangul filler        -> stripped
#   U+2063 invisible separator  -> stripped
#   U+17B5 khmer inherent aa    -> survives, but measures 0px wide: no gap at all
#   U+2502 box drawings light   -> SURVIVES and renders, 10px   <- this one
#
# Discord rewrites every character Unicode calls whitespace into a hyphen and
# strips every zero-width one, and it answers 200 while doing either, so a
# candidate is only believed after it is applied and read back. U+17B5 is the
# trap in that list: it survives storage, so the reconciler goes quiet and the
# name looks right in the file while rendering identically to no separator.
# Measured in Discord's own font, gg sans 16px, against a real space at 3.5px.
#
# A separator Discord strips is worse than none. The file can then never match
# what Discord stored, so the reconciler reports the same rename on every run
# and the plan stops meaning anything.
#
# The bar also matches the identity rather than borrowing Discord's: CLAUDE.md
# already puts box-drawing glyphs where monospace alignment carries meaning, and
# the bench site is built out of them.
#
# RENAMING IS RATE LIMITED: two changes per ten minutes PER CHANNEL, and the wait
# is minutes, not seconds. A rename sweep across eight channels does not finish in
# one apply, and that is normal rather than a failure. Apply says so and carries
# on to the channels it can still touch.
# ---------------------------------------------------------------------------

[[channels]]
id = "1541487310070087781"
name = "👋│start-here"
category = "welcome"
topic = "install the pack, get whitelisted, join"
surface = "getstarted"
readonly = true

[[channels]]
id = "1541487311944945834"
name = "📣│announcements"
category = "welcome"
topic = "pack releases and anything that changes how you play"
surface = "release"
readonly = true

[[channels]]
id = "1540075306126286930"
name = "💬│general"
category = "the server"
topic = "talk about anything"

[[channels]]
id = "1541487314658660532"
name = "📊│status"
category = "the server"
topic = "is it up, who is on, what it costs"
surface = "status"
readonly = true

[[channels]]
id = "1541487315560435834"
name = "🗺│map"
category = "the world"
topic = "the live│map, and the Activity"
surface = "map"
readonly = true

[[channels]]
id = "1541487317078900786"
name = "🔔│feed"
category = "the world"
topic = "joins, deaths, advancements, as they happen"
surface = "events"
readonly = true
visible_to = ["player"]

[[channels]]
id = "1541487318161035275"
name = "💖│supporters"
category = "the world"

# The Discord server, declared. `wly guild plan` diffs this against reality and
# `wly guild apply` makes reality match. The layout becomes a reviewable diff,
# the same way jvm-profiles.toml and docker-compose.yml already are.
#
# Roles and channels are ARRAYS OF TABLES, not named tables, because order is
# meaning here and a named table lands in a Go map, which has none. Role order
# is the hierarchy, highest first. Channel order is display order in its
# category. The first version of this file said "order here is the hierarchy"
# while parsing into something that could not preserve it.
#
# Three rules the reconciler encodes, each of which is a way to lose data:
#
#   1. A bot can only manage roles STRICTLY BELOW its own highest role. The wly
#      role goes at the top of the server's role list and nothing declared here
#      may outrank it. `plan` REFUSES to run when it finds one that does, rather
#      than emitting changes that would silently no-op.
#   2. APPLY NEVER DELETES. A channel or role present on the server and absent
#      here is reported as drift and left alone. Removing it is `--prune`, typed
#      by a human who read the plan. Destroying a channel of history to satisfy
#      a config file is the 3am page.
#   3. Gradients are not always available. `colors` needs the ENHANCED_ROLE_COLORS
#      guild feature, which is boost-gated. Every role also declares a flat
#      `color`, and the reconciler downgrades rather than failing when the
#      feature is absent.

[guild]
name = "wly"
# Reconciliation refuses to touch a guild whose id does not match, so a token
# pointed at the wrong server cannot rewrite it. Empty means "refuse everything".
id = "1540075305652199514"

# ---------------------------------------------------------------------------
# Roles, highest first. wly's own role is not declared here: Discord creates it
# when the bot joins, and it must sit above every one of these.
# ---------------------------------------------------------------------------

[[roles]]
name = "admin"
color = "#C4705C"
hoist = true
permissions = ["Administrator"]
# Declared so drift reports name it, never edited by the reconciler. A config
# file is the wrong place to be the authority on who is an administrator.
manual = true

[[roles]]
name = "supporter"
# The one gradient the palette earns: heart into the warning gold. Supporters
# are the only hoisted cosmetic role, which is most of the perk.
color = "#E39AAE"
colors = { primary = "#E39AAE", secondary = "#D8A657" }
hoist = true
mentionable = false
granted_by = "entitlement"      # the payment rail, via the Worker and KV

[[roles]]
name = "day-one"
color = "#D8A657"
granted_by = "linked_role"
metadata_key = "first_joined"

[[roles]]
name = "deathless"
# Costs nothing, means something, and is lost the moment you die. The cheapest
# status perk there is.
color = "#8FA860"
granted_by = "linked_role"
metadata_key = "deaths"

[[roles]]
name = "rooted"
color = "#84A69C"
granted_by = "linked_role"
metadata_key = "playtime_hours"
threshold = 100

[[roles]]
name = "settled"
color = "#84A69C"
granted_by = "linked_role"
metadata_key = "playtime_hours"
threshold = 10

[[roles]]
name = "player"
# Whitelisted AND has actually connected. Gates the in-game channels, so a
# lurker sees the door and not the room.
color = "#8E8677"
granted_by = "linked_role"
metadata_key = "has_joined"

# ---------------------------------------------------------------------------
# Channels, in display order within each category. `surface` names the pinned
# message wly owns and edits in place; a channel with one is wly's to write in.
# ---------------------------------------------------------------------------

[[channels]]
name = "start-here"
category = "welcome"
topic = "install the pack, get whitelisted, join"
surface = "getstarted"
readonly = true

[[channels]]
name = "announcements"
category = "welcome"
topic = "pack releases and anything that changes how you play"
surface = "release"
readonly = true

[[channels]]
name = "general"
category = "the server"
topic = "talk about anything"

[[channels]]
name = "status"
category = "the server"
topic = "is it up, who is on, what it costs"
surface = "status"
readonly = true

[[channels]]
name = "map"
category = "the world"
topic = "the live map, and the Activity"
surface = "map"
readonly = true

[[channels]]
name = "feed"
category = "the world"
topic = "joins, deaths, advancements, as they happen"
surface = "events"
readonly = true
visible_to = ["player"]

[[channels]]
name = "supporters"
category = "the world"
topic = "thank you, genuinely"
visible_to = ["supporter"]

[[channels]]
name = "ops"
category = "ops"
topic = "spend, health, backups. wly talks to itself in here."
surface = "spend"
visible_to = ["admin"]

# ---------------------------------------------------------------------------
# Custom emoji. The square 8x8 icons in scripts/pixelicons.py, uploaded so the
# surfaces can use them inline as <:name:id>.
#
# Discord cannot render SVG in a message, so this is the only way those icons
# reach a player. Uploads are 128x128 and 256 KiB max, which an 8x8 grid scaled
# with nearest-neighbour clears by a mile. Managing them needs
# CREATE_GUILD_EXPRESSIONS on the bot.
# ---------------------------------------------------------------------------

[emojis]
source = "scripts/pixelicons.py"
upload = ["heart", "shovel", "map", "coin", "skull", "player", "villager", "machines", "world"]

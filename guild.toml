# The Discord server, declared. `wly guild plan` diffs this against reality and
# `wly guild apply` makes reality match. The layout becomes a reviewable diff,
# the same way jvm-profiles.toml and docker-compose.yml already are.
#
# NOT YET IMPLEMENTED. This file is the design half of phase D0; the reconciler
# is D1. It is committed now because the shape of it is what D1 is built
# against, and because writing the traps down before the code exists is the
# whole point of a design pass.
#
# Three rules the reconciler must encode, each of which is a way to lose data:
#
#   1. A bot can only manage roles STRICTLY BELOW its own highest role. The wly
#      role goes at the top of the list and nothing declared here may outrank
#      it, or apply silently no-ops on exactly the roles that matter. `plan`
#      refuses to run if it finds a managed role above the bot.
#   2. APPLY NEVER DELETES. A channel or role present on the server and absent
#      here is reported as drift and left alone. Removing it is `--prune`, typed
#      by a human who read the plan. Destroying a channel of history to satisfy
#      a config file is the 3am page.
#   3. Gradients are not always available. `colors.secondary` and `.tertiary`
#      need the ENHANCED_ROLE_COLORS guild feature, which is boost-gated. Every
#      role therefore declares `color` as a flat fallback, and the reconciler
#      downgrades rather than failing when the feature is absent.

[guild]
name = "wly"
# Reconciliation refuses to touch a guild whose id does not match, so a token
# pointed at the wrong server cannot rewrite it. Empty means "refuse everything".
id = ""

# ---------------------------------------------------------------------------
# Roles. Order here is the hierarchy, highest first, and wly must be above all
# of the roles it manages.
# ---------------------------------------------------------------------------

[roles.admin]
color = "#C4705C"
hoist = true
permissions = ["Administrator"]
managed_by_hand = true          # declared so drift reports mention it, never edited

[roles.supporter]
# The one gradient the palette earns: heart into the warning gold. Supporters
# are the only hoisted cosmetic role, which is the perk.
color = "#E39AAE"
colors = { primary = "#E39AAE", secondary = "#D8A657" }
hoist = true
mentionable = false
granted_by = "entitlement"      # the payment rail, via the Worker + KV

[roles.day-one]
color = "#D8A657"
granted_by = "linked_role"      # first_joined before the cutoff
metadata_key = "first_joined"

[roles.deathless]
# Costs nothing, means something, and is lost the moment you die. The cheapest
# status perk there is.
color = "#8FA860"
granted_by = "linked_role"
metadata_key = "deaths"

[roles.settled]
color = "#84A69C"
granted_by = "linked_role"
metadata_key = "playtime_hours"
threshold = 10

[roles.rooted]
color = "#84A69C"
granted_by = "linked_role"
metadata_key = "playtime_hours"
threshold = 100

[roles.player]
# Whitelisted AND has actually connected. Gates the in-game channels, so a
# lurker sees the door and not the room.
color = "#8E8677"
granted_by = "linked_role"
metadata_key = "has_joined"

# ---------------------------------------------------------------------------
# Channels. `category` groups them; `pinned_surface` names the surface wly owns
# and edits in place. A channel with a pinned surface is wly's to write in.
# ---------------------------------------------------------------------------

[channels.start-here]
category = "welcome"
topic = "install the pack, get whitelisted, join"
pinned_surface = "getstarted"
readonly = true

[channels.announcements]
category = "welcome"
topic = "pack releases and anything that changes how you play"
pinned_surface = "release"
readonly = true

[channels.general]
category = "the server"
topic = "talk about anything"

[channels.status]
category = "the server"
topic = "is it up, who is on, what it costs"
pinned_surface = "status"
readonly = true

[channels.map]
category = "the world"
topic = "the live map · open the Activity here"
pinned_surface = "map"
readonly = true

[channels.feed]
category = "the world"
topic = "joins, deaths, advancements, as they happen"
pinned_surface = "events"
readonly = true
visible_to = ["player"]

[channels.supporters]
category = "the world"
topic = "thank you, genuinely"
visible_to = ["supporter"]

[channels.ops]
category = "ops"
topic = "spend, health, backups. wly talks to itself in here."
pinned_surface = "spend"
visible_to = ["admin"]

# ---------------------------------------------------------------------------
# Custom emoji. The square 8x8 icons in scripts/pixelicons.py, uploaded so the
# surfaces can use them inline as <:name:id>.
#
# Discord cannot render SVG in a message, so this is the only way those icons
# reach a player. Uploads are 128x128 and 256 KiB max, which an 8x8 grid scaled
# with nearest-neighbour clears by a mile. The reconciler needs a PNG encoder to
# do it and there is not one yet, so this list is the contract, not a feature.
#
# Managing these needs CREATE_GUILD_EXPRESSIONS on the bot.
# ---------------------------------------------------------------------------

[emojis]
source = "scripts/pixelicons.py"
upload = ["heart", "shovel", "map", "coin", "skull", "player", "villager", "machines", "world"]

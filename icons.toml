# The 8x8 pixel icon set. 8x8 because that is exactly how big a head is in a
# Minecraft skin file.
#
# ONE SOURCE, TWO LANGUAGES. scripts/pixelicons.py renders these as inline SVG
# for the published pages; internal/discord renders them as 128x128 PNG to
# upload as Discord custom emoji, because Discord cannot render SVG in a
# message. They used to live in the Python only, which meant Go could not
# upload them, and copying them into Go would have recreated exactly the drift
# the shared palette was just extracted to stop.
#
# A character with no palette entry is transparent, which is what `.` means.

[palette]
"h" = "#3A2A16"  # hair
"s" = "#B58868"  # skin
"p" = "#C8A882"  # villager skin, paler
"n" = "#A97B57"  # that nose
"w" = "#E8E8E8"  # eye white
"b" = "#3A5FCD"  # eye
"m" = "#6E4A32"  # mouth
"f" = "#7A7A7A"  # machine frame
"d" = "#3A3A3A"  # machine interior
"g" = "#D8A657"  # a lit panel, and gold
"y" = "#A87A2E"  # gold, in shadow
"G" = "#6A8F3C"  # grass
"D" = "#79553A"  # dirt
"H" = "#E39AAE"  # heart
"o" = "#7A5C3A"  # tool handle
"i" = "#C9CCD1"  # iron
"P" = "#D8C9A3"  # parchment
"r" = "#C4705C"  # a route drawn on it, and anything gone wrong
"k" = "#E8E4D8"  # bone
"x" = "#2A2622"  # a hole


# Disabled because it cannot work, and the reason is the interesting part.
# Verified against itzg/minecraft-server:java25-graalvm:
#
#   GraalError: Shenandoah garbage collector is not supported by Graal
#   JVMCI compiler disabled after 11 of 11 upcalls had errors
#
# HotSpot accepts -XX:+UseShenandoahGC and then the Graal compiler fails on every
# method and switches itself off. A run that survived this would be measuring
# GraalVM with no Graal JIT, the worst kind of row, because it looks like a
# GraalVM result. The preflight does catch it (java exits non-zero), so this is
# belt and braces: the combination is simply not available.

# Candidate JVM profiles for `wly bench`. Nothing here is believed until it has
# a row in BENCHMARKS.md.
#
# Two dimensions, not one: the JDK and the flags. Minecraft 1.21.1 only requires
# Java 21, but it runs happily on newer JDKs, and the single largest lever found
# since the flag research everyone still cites, compact object headers, JEP 519
# , does not exist before 25. Pinning to 21 because it is what the game asks for
# would leave that on the table.
#
# Every profile is preflighted: wly runs `java <flags> -version` first and drops
# whatever the JVM rejects, logging what it dropped. That is what keeps this file
# honest across JDK bumps without anyone re-reading release notes.

# ---------------------------------------------------------------------------
# Running an older pack on a newer JDK
# ---------------------------------------------------------------------------
# The compatibility story is a known flag, not a gamble:
#
#   JDK 21  sun.misc.Unsafe memory access works
#   JDK 24  --sun-misc-unsafe-memory-access=warn by default
#   JDK 25  still warn, mods keep working, the log gets noisier
#   JDK 26  DENY by default: it throws. Needs =allow explicitly.
#   JDK 27+ removed outright, the flag is ignored. A real wall for 1.21.1-era mods.
#
# So 25 is cheap, 26 costs one flag, and 27 is where this stops being a decision
# we get to make. The same applies to JNI: JEP 472 restricts native access, and
# older natives (Netty, LWJGL paths) want it permitted explicitly.

[compat]
# Applied to every profile from java 25 up. These are launcher options, so they
# belong in itzg's JVM_OPTS rather than JVM_XX_OPTS.
java25plus = [
    "--sun-misc-unsafe-memory-access=allow",
    "--enable-native-access=ALL-UNNAMED",
    "--illegal-native-access=allow",
]

# ---------------------------------------------------------------------------
# Instruments
# ---------------------------------------------------------------------------
# spark, after all, the earlier exclusion here was wrong about the cause.
#
# What was recorded: spark's bundled async-profiler segfaults the JVM on
# Java 25 / aarch64 (SIGSEGV at pc=0x0 in VMThread::nativeThreadId, ten restart
# loops). That crash was real. The conclusion drawn from it was not.
#
# spark runs a BACKGROUND profiler on servers by default, and that is what
# engages async-profiler at boot. `-Dspark.backgroundProfiler=false` stops it,
# and tick timing is unaffected because it comes from spark's own tick hook and
# never touches the native agent. Verified on the bench box itself, aarch64,
# Java 25: Done (1.670s), 45 mods, no segfault.
#
# 1.10.109 (2024-09-26) really is the newest build declaring 1.21.1, Modrinth
# lists two and spark has moved on to >=26.1, so this is pinned and will not
# move until the pack does.
#
# spark answers `/spark tps` on a worker thread rather than to the caller, so
# RCON returns nothing and the numbers land in the server log, which the harness
# already reads. What that buys:
#
#   TPS              20 is the ceiling; below it the server is failing to keep up
#   MSPT med and p95 tick duration. A tick is 50ms, so a p95 above that is a
#                    server routinely behind, the thing a player actually feels,
#                    and invisible in chunks/sec alone
#
# So the instruments are now:
#
#   throughput   Chunky prints chunks/sec to the server log during pregeneration
#   tick health  spark, background profiler off
#   GC pauses    -Xlog:gc, parsed from the container log. Chosen over JFR after
#                writing the driver: the pause distribution is the only thing
#                the sweep needs from the collector, and a log line needs no
#                recording lifecycle, no dump step and no jfr tool in the image.
#   memory, cpu  docker stats, one call carrying both
#
# ponytail: async-profiler 2.9 is what spark 1.10.109 bundles and it is from
# 2022. Current spark ships 4.5, whose aarch64 native exports every JNI symbol
# 2.9 did, so swapping just that file into the jar would likely restore flame
# graphs on this hardware. Not done, because tick timing does not need it.

# ---------------------------------------------------------------------------
# How the sweep is run
# ---------------------------------------------------------------------------
# `flagsets` composes the named lists below; a profile's own `xx` is applied
# after them, so it is the last word on a conflict.
#
# Two passes, not one. The matrix below is 18 enabled profiles; at full radius
# and 3 repeats that is roughly 50 hours of a box that costs money to run. So:
#
#   pass 1  screening     --runs 1 --radius 500 -out BENCHMARKS-screening.md
#   pass 2  confirmation  --runs 3 --radius 1000 --only <winner>  -> BENCHMARKS.md
#
# A single run has no variance to report, which is exactly why pass 2 exists.
# Never compare a screening number to a confirmed one.

# ---------------------------------------------------------------------------
# Flagsets
# ---------------------------------------------------------------------------
# From brucethemoose/Minecraft-Performance-Flags-Benchmarks, which is the best
# sourced flag research that exists for Minecraft and is also four years old.
# Split into named sets rather than kept as one blob, because parts of it do not
# apply everywhere and the preflight cannot always tell us so:
#
#   - `java <flags> -version` catches flags the JVM REJECTS. Verified: it drops
#     -XX:G1ConcRSHotCardLimit and -XX:G1ConcRefinementServiceIntervalMillis on
#     JDK 25, which are fatal there rather than warnings. Both are omitted below
#     rather than left for the preflight to strip on every single run.
#   - It cannot catch flags the JVM ACCEPTS and then ignores. That is a real
#     category, and the reason `bruce-c2` is separate: GraalVM sets
#     UseJVMCICompiler=true, so Graal replaces C2 and every {C2 product} flag is
#     inert there while still being accepted. Graal profiles omit that set.
#
# Deliberately not included anywhere:
#   -XX:+UseVectorCmov               {C2 product} and x86-only; this box is aarch64.
#   -XX:+UseFastUnorderedTimeStamps  x86 TSC.
#   -XX:+UseLargePages               needs a privilege the container lacks.
#   -XX:InitiatingHeapOccupancyPercent  G1UseAdaptiveIHOP defaults to true, which
#                                    makes it a starting value only. Pinning it
#                                    needs -XX:-G1UseAdaptiveIHOP; the guide
#                                    predates adaptive IHOP being the default.

[flagsets]
# Compiler- and collector-neutral. Safe on every JDK in the matrix.
bruce-common = [
    "-XX:+UnlockExperimentalVMOptions",
    "-XX:+UnlockDiagnosticVMOptions",
    "-XX:+AlwaysActAsServerClassMachine",
    "-XX:+AlwaysPreTouch",
    "-XX:+DisableExplicitGC",
    "-XX:NmethodSweepActivity=1",
    "-XX:ReservedCodeCacheSize=400M",
    "-XX:NonNMethodCodeHeapSize=12M",
    "-XX:ProfiledCodeHeapSize=194M",
    "-XX:NonProfiledCodeHeapSize=194M",
    "-XX:-DontCompileHugeMethods",
    "-XX:+PerfDisableSharedMem",
    "-XX:AllocatePrefetchStyle=3",
]

# C2 only. Omitted on GraalVM, where Graal is the top-tier compiler instead.
bruce-c2 = ["-XX:MaxNodeLimit=240000", "-XX:NodeLimitFudgeFactor=8000"]

# G1, tuned. The two removed refinement flags are gone; see above.
bruce-g1 = [
    "-XX:+UseG1GC",
    "-XX:MaxGCPauseMillis=37",
    "-XX:G1HeapRegionSize=16M",
    "-XX:G1NewSizePercent=23",
    "-XX:G1ReservePercent=20",
    "-XX:SurvivorRatio=32",
    "-XX:G1MixedGCCountTarget=3",
    "-XX:G1HeapWastePercent=20",
    "-XX:MaxTenuringThreshold=1",
    "-XX:G1SATBBufferEnqueueingThresholdPercent=30",
    "-XX:G1ConcMarkStepDurationMillis=5.0",
    "-XX:GCTimeRatio=99",
]

# ---------------------------------------------------------------------------
# The wly sets: tuned for THIS box rather than copied from a desktop guide
# ---------------------------------------------------------------------------
# Everything published about Minecraft JVM flags assumes a desktop with threads
# to spare. This box has two cores, which changes which levers matter:
#
#   - GC thread counts are already right. The JVM sizes them from the CPU count,
#     so two cores gets ParallelGCThreads=2 and ConcGCThreads=1 on its own. On a
#     twelve-core desktop the same JVM picks 10 and 3, which is why copied flag
#     sets so often pin numbers that only make sense there.
#   - Pause targets fight the tick loop. A 37ms target on two cores just runs GC
#     more often, and every one of those collections competes with the thread
#     that has to finish a tick in 50ms. Aiming at one tick is honest; aiming
#     under it is wishful.
#   - Compact object headers are off by default and Minecraft is the archetypal
#     small-object workload. This is the largest single lever available on 25.
#
# Nothing here is believed until it has a row. These are hypotheses with reasons,
# which is the most a flag set can be before it is measured.

# Neutral: no collector, no compiler assumptions. Safe on Temurin and GraalVM.
wly-common = [
    "-XX:+UnlockExperimentalVMOptions",
    # JEP 519. 8-byte headers instead of 12/16, on a workload made of millions
    # of small objects. FerriteCore exists to solve this problem in Java.
    "-XX:+UseCompactObjectHeaders",
    # Commit the heap up front. 6G of 12G, so there is room, and it keeps the
    # allocator from stalling a tick to fault in new pages.
    "-XX:+AlwaysPreTouch",
    # Mods call System.gc(). A full stop-the-world collection mid-tick is worse
    # than whatever the mod thought it was fixing.
    "-XX:+DisableExplicitGC",
    # Minecraft has genuinely huge methods and the default refuses to compile
    # them, leaving hot code interpreted.
    "-XX:-DontCompileHugeMethods",
    # Many mods means a lot of JIT output. The default cache fills and the JIT
    # starts discarding compiled code, which shows up as the server slowly
    # getting worse rather than as an error.
    "-XX:ReservedCodeCacheSize=384M",
    # The perf memory file lives in /tmp and an fsync there can stall a tick.
    "-XX:+PerfDisableSharedMem",
]

# G1 for two cores. Sized against 6G rather than against a desktop.
wly-g1 = [
    "-XX:+UseG1GC",
    # One tick. Not 37ms: on two cores a tighter target buys more collections,
    # each competing with the thread trying to finish that tick.
    "-XX:MaxGCPauseMillis=50",
    # Ergonomics picks 2M for this heap, giving ~3000 regions. 8M gives ~750,
    # which is less per-region bookkeeping for the one core doing the marking.
    "-XX:G1HeapRegionSize=8M",
    # Minecraft allocates heavily and dies young. A larger young generation
    # keeps that churn out of the old generation entirely.
    "-XX:G1NewSizePercent=30",
    "-XX:G1MaxNewSizePercent=50",
    # Adaptive IHOP is on by default, which quietly overrides any value set for
    # InitiatingHeapOccupancyPercent. Turn it off or do not bother setting one.
    "-XX:-G1UseAdaptiveIHOP",
    "-XX:InitiatingHeapOccupancyPercent=45",
    # Default is 15, brucethemoose uses 1. Both extremes cost: 15 copies
    # survivors repeatedly, 1 promotes everything to old gen and buys mixed
    # collections. 4 is a guess in the middle, and it is a guess.
    "-XX:MaxTenuringThreshold=4",
]

# The two-core bet: a collector that never runs beside the tick loop.
#
# Every concurrent collector spends CPU marking while the server ticks, and with
# two cores that CPU comes out of the tick. Parallel stops the world, does the
# work with both cores, and gets out. Longer individual pauses, none of them
# competing. On a desktop this loses; here it might not, and that is exactly the
# sort of thing nobody publishes because nobody benchmarks two cores.
wly-parallel = [
    "-XX:+UseParallelGC",
    "-XX:MaxGCPauseMillis=50",
]

# GraalVM only. The jdk.graal prefix is the current one; the bare graal prefix
# is deprecated and warns that it will be ignored in a future release.
wly-graal = [
    "-Djdk.graal.TuneInlinerExploration=1",
]

zgc-gen        = ["-XX:+UseZGC"]
shenandoah-gen = ["-XX:+UseShenandoahGC", "-XX:ShenandoahGCMode=generational"]
parallel       = ["-XX:+UseParallelGC"]
serial         = ["-XX:+UseSerialGC"]
coh            = ["-XX:+UseCompactObjectHeaders"]

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------
# Two dimensions crossed: the JDK and the collector. Deliberately not
# rectangular, compact object headers need 25 and generational Shenandoah needs
# 24, so the 21 rows are shorter. That asymmetry is a finding, not an omission.
#
# itzg's java21 and java25 are Eclipse Temurin (21.0.11+10 and 25.0.3+9), so
# Adoptium is already the base here. OpenJDK and Temurin are not two things to
# measure: Temurin is a build of OpenJDK, and Oracle JDK is a third build of the
# same source that differs in licensing rather than throughput. The vendor axis
# that actually moves numbers is the compiler, HotSpot/C2 versus the Graal JIT
# replacing C2, which is why GraalVM gets rows and Oracle JDK does not.
#
# `image` is the itzg tag. `xx` goes to JVM_XX_OPTS, `opts` to JVM_OPTS.
# `aikar = true` leaves USE_AIKAR_FLAGS on; a profile that brings its own
# collector must turn it off, since Aikar's set is G1-specific.

[profiles.baseline-j21]
description = "What ships today. The control every other row is measured against."
image = "itzg/minecraft-server:java21"
aikar = true

[profiles.j21-g1-bruce]
description = "The reference flag set on the JDK the game actually asks for."
image = "itzg/minecraft-server:java21"
aikar = false
flagsets = ["bruce-common", "bruce-c2", "bruce-g1"]

[profiles.j21-parallel]
description = """
ParallelGC on two cores. Every published recommendation assumes a desktop with
threads to spare for concurrent collection; this box has two. A stop-the-world
collector that never steals a core from the tick loop may simply win here, and
nobody publishes that number because nobody benchmarks on a 2-core VM.
"""
image = "itzg/minecraft-server:java21"
aikar = false
flagsets = ["bruce-common", "bruce-c2", "parallel"]

[profiles.j21-serial]
description = "The same argument as Parallel, taken to its end. Cheap to include."
image = "itzg/minecraft-server:java21"
aikar = false
flagsets = ["bruce-common", "bruce-c2", "serial"]

[profiles.j21-zgc]
description = """
Generational ZGC. Expect it to lose under a small heap on two cores and to pay
off only well above it, the point is to find where the crossover actually is on
this box, not to confirm folklore. Non-generational mode is gone (JEP 490) and
-XX:+ZGenerational is obsolete in 25, so most published ZGC advice is stale.
"""
image = "itzg/minecraft-server:java21"
aikar = false
flagsets = ["bruce-common", "bruce-c2", "zgc-gen"]

[profiles.j25-g1]
description = "Same collector, newer JDK. Isolates the cost or benefit of the JDK jump alone."
image = "itzg/minecraft-server:java25"
aikar = true

[profiles.j25-g1-coh]
description = """
The headline candidate. Compact object headers went production in JDK 25 (JEP 519):
8-byte headers instead of 12/16, ~22% less heap on SPECjbb and 10-20% less live data
on small-object-heavy workloads. Minecraft is the archetypal small-object workload
(FerriteCore exists because of exactly this problem), and I could find no published
Minecraft numbers for it. This is the row worth running first.
"""
image = "itzg/minecraft-server:java25"
aikar = true
flagsets = ["coh"]

# ---------------------------------------------------------------------------
# Heap size, as its own dimension
# ---------------------------------------------------------------------------
# The question is not whether Minecraft CAN use the whole box. It is where more
# memory stops buying throughput. If 6G and 10G land inside the noise floor then
# the difference is decorative RAM, and it belongs to the page cache and the OS
# instead, on a box with 12GB total and no swap, that is not a small decision.
#
# Run against the profile that ships today, so the answer is actionable now and
# does not wait on the collector shootout. `memory` defaults to 6G, which is what
# deploy/docker-compose.yml sets, so every other profile keeps measuring what
# production actually runs.

[profiles.j25-g1-coh-4g]
description = "Compact headers on a heap smaller than production's. Where does it start hurting?"
image = "itzg/minecraft-server:java25"
aikar = true
memory = "4G"
flagsets = ["coh"]

[profiles.j25-g1-coh-8g]
description = "Two gigabytes more than production. Does throughput notice?"
image = "itzg/minecraft-server:java25"
aikar = true
memory = "8G"
flagsets = ["coh"]

[profiles.j25-g1-coh-10g]
description = """
Ten of the box's twelve gigabytes, leaving two for the OS, Docker and page
cache. Also the closest thing the matrix has to a deliberate stress case: if
memory pressure ever destabilises this box, this is the row that will show it.
"""
image = "itzg/minecraft-server:java25"
aikar = true
memory = "10G"
flagsets = ["coh"]

[profiles.j25-g1-bruce-coh]
description = "The reference flag set plus the headline candidate, on current Temurin."

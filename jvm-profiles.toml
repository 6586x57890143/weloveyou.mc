# The wly suite: the same reasoning across three JDKs and two collectors
# ---------------------------------------------------------------------------
# These are the rows to beat. If none of them outrun aikar-on-25, that is a
# finding too, and a cheaper one than believing they would.

[profiles.j25-wly-g1]
description = """
G1 sized for two cores and a 6G heap rather than for a desktop. The whole set is
argued in the flagsets above; the short version is that GC thread counts are
already correct from ergonomics, so the levers that remain are compact object
headers, region sizing, and not asking for a pause target shorter than a tick.
"""
image = "itzg/minecraft-server:java25"
aikar = false
flagsets = ["wly-common", "wly-g1"]

[profiles.j25-wly-parallel]
description = """
ParallelGC on two cores. Every concurrent collector spends CPU marking while the
server ticks, and here that CPU comes straight out of the tick. Parallel stops
the world, uses both cores, and gets out of the way. It should lose on paper and
might not lose here.
"""
image = "itzg/minecraft-server:java25"
aikar = false
flagsets = ["wly-common", "wly-parallel"]

[profiles.j25-wly-graalvm]
description = """
The same set on Oracle GraalVM, minus anything C2-specific, since Graal replaces
C2 and those flags are accepted and then ignored. Chunk generation is the
workload Graal's inliner is supposed to be good at, so if the JIT is worth
anything here this is where it shows.
"""
image = "itzg/minecraft-server:java25-graalvm"
aikar = false
flagsets = ["wly-common", "wly-g1", "wly-graal"]

[profiles.j21-wly-g1]

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  # Workflow bumps are raised but never auto-merged: they edit
  # .github/workflows, which the automatic GITHUB_TOKEN may not merge. See the
  # dependabot-merge job in ci.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }

name: bench-admin

# One-off maintenance on the bench box, run by hand.
#
# The bench box has no public SSH (port 22 is closed) and is not on the tailnet,
# so the self-hosted runner is the only channel that reaches it. That is fine for
# occasional administration and deliberately awkward for anything else: this
# workflow is workflow_dispatch only, and every action it can take is an explicit
# choice in the list below rather than a free-form command.
#
# DO NOT ADD pull_request HERE, for the same reason bench.yml must not have it:
# this repository is public and this job runs on a self-hosted runner.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do on the bench box"
        required: true
        default: diagnose
        type: choice
        options:
          # Read-only. Answers "why did the sweep die" with log lines rather
          # than theories: OOM kills, panics, reboots, and the memory headroom
          # that was actually available.
          - diagnose
          # Joins the tailnet so the box can be reached directly, which makes
          # every future diagnosis an ssh away instead of a workflow run.
          - tailscale-up
          # Masks the timers that would otherwise run apt in the middle of a
          # measurement. Re-run after reprovisioning; provision-box.sh lives on
          # the production box and is not version controlled, so this is the
          # only copy of the fix that survives.
          - quiet-timers
          # Installs a nightly power-off that checks first whether a sweep is
          # running. The old one lived on the production box and stopped a
          # healthy sweep seven hours in.
          - self-stop

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  admin:
    name: ${{ github.event.inputs.action }}
    runs-on: [self-hosted, bench]
    timeout-minutes: 15
    steps:
      - name: diagnose
        if: github.event.inputs.action == 'diagnose'
        run: |
          echo "### bench box diagnosis" >> "$GITHUB_STEP_SUMMARY"
          exec 2>&1
          {
            echo "## uptime and boot history"
            uptime
            who -b || true
            last -x reboot shutdown 2>/dev/null | head -8 || true

            echo
            echo "## memory and swap"
            free -m
            swapon --show || echo "(no swap configured)"

            echo
            echo "## is the journal even persistent across boots?"
            # This decides whether anything below can answer the question at
            # all. Cloud images often keep the journal in /run, which means a
            # reboot erases exactly the evidence a crash leaves behind.
            sudo journalctl --list-boots --no-pager 2>/dev/null | tail -8 || echo "(no boot list)"
            ls -d /var/log/journal 2>/dev/null && echo "journal is persistent" || echo "JOURNAL IS VOLATILE - previous boots are gone"

            echo
            echo "## the question: was anything OOM-killed, in ANY boot?"
            # _TRANSPORT=kernel rather than -k: `-k` implies `-b`, so it would
            # only ever search the CURRENT boot, and this box rebooted after
            # the crash. That would report a reassuring zero and prove nothing.
            n=$(sudo journalctl _TRANSPORT=kernel --no-pager 2>/dev/null | grep -ciE 'out of memory|oom-kill|killed process' || true)
            echo "kernel OOM lines across all retained boots: ${n:-0}"
            sudo journalctl _TRANSPORT=kernel --no-pager 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -10 || true

            echo
            echo "## everything around the crash window, any boot, any unit"
            sudo journalctl --no-pager --since '2026-08-19 14:15' --until '2026-08-19 14:35' 2>/dev/null | tail -60 || true

            echo
            echo "## the previous boot's tail - how did it end?"
            sudo journalctl -b -1 --no-pager 2>/dev/null | tail -30 || echo "(no previous boot retained)"

            echo
            echo "## why did the runner stop?"
            sudo tail -40 /home/ubuntu/actions-runner/_diag/Runner_*.log 2>/dev/null | tail -40 || echo "(no runner diag logs readable)"

            echo
            echo "## docker state"
            docker ps -a --format '{{.Names}} {{.Status}}' | head
            docker system df 2>/dev/null | head -5
            df -h / | tail -1
          } | tee /tmp/diag.txt
          {
            echo '```'
            cat /tmp/diag.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: join the tailnet
        if: github.event.inputs.action == 'tailscale-up'
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -euo pipefail
          if [ -z "${TS_AUTHKEY:-}" ]; then
            echo "::error::TS_AUTHKEY is not set on this repository"
            exit 1
          fi
          # provision-box.sh installs the tailscale package but never
          # authenticates it, which is why this box was unreachable.
          #
          # Deliberately NOT --ssh. Tailscale SSH takes over port 22 on the
          # tailnet address and enforces the tailnet ACL, which refuses tagged
          # nodes by default: "tailnet policy does not permit you to SSH to this
          # node". Plain sshd already accepts the key seeded into
          # authorized_keys at provision time, so the tailnet only needs to
          # provide the route, not the authentication.
          sudo tailscale up --authkey "$TS_AUTHKEY" --hostname weloveyou-bench \
            --advertise-tags=tag:ci --ssh=false --accept-dns=false
          echo "joined as: $(tailscale ip -4 2>/dev/null | head -1)"
          {
            echo "### bench box joined the tailnet"
            echo
            echo "- address: \`$(tailscale ip -4 2>/dev/null | head -1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # A benchmark box has to be boring. This one was not.
      #
      # apt-daily.timer and apt-daily-upgrade.timer are OnCalendar=6:00 with
      # Persistent=true, so a box that is powered off except when sweeping fires
      # the MISSED 06:00 run shortly after every boot, which is exactly when a
      # sweep is running. On 2026-08-19 the box booted at 13:52, apt-daily-
      # upgrade started at 14:22:57, and the sweep was cancelled at 14:25:25.
      # That run consumed 4min 7s of CPU on a two-core machine.
      #
      # The cancelled job is the visible half. The invisible half is worse: any
      # profile measured while apt is using both cores produces a number that
      # looks perfectly reasonable and is wrong.
      - name: quiet the timers that ruin measurements
        if: github.event.inputs.action == 'quiet-timers'
        run: |
          set -euo pipefail
          sudo systemctl mask --now \
            apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service \
            motd-news.timer update-notifier-motd.timer fwupd-refresh.timer ua-timer.timer
          echo "masked. remaining timers:"
          systemctl list-timers --no-pager | head -8
          {
            echo "### bench box quietened"
            echo
            echo "Masked apt-daily, apt-daily-upgrade, unattended-upgrades and the motd/fwupd/ua timers."
            echo
            echo "sysstat-collect is deliberately left running, ten-minutely CPU history is"
            echo "evidence, not noise, and it is what would corroborate the next anomaly."
            echo
            echo '```'
            systemctl list-timers --no-pager | head -8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The bench box used to be powered off at 23:30 UTC by a timer on the
      # production box that called `bench-power.sh stop` unconditionally. On
      # 2026-08-19 that stopped a healthy sweep seven hours in and nine runs
      # deep: "The runner has received a shutdown signal". The safety net cost
      # more than the failure it guarded against.
      #
      # The check has to happen here, not on production, because only this box
      # can see whether a job is running, and production holds no key for it.
      # Installed through the runner rather than over SSH because the tailnet
      # auth key is ephemeral, so the box drops off the tailnet on every reboot.
      - name: install the busy-aware self-stop
        if: github.event.inputs.action == 'self-stop'
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/wly
          sudo tee /opt/wly/bench-idle.sh >/dev/null <<'EOF'
          #!/usr/bin/env bash
          # Power this box off at night, unless a sweep is running.
          set -uo pipefail
          if pgrep -f 'Runner.Worker' >/dev/null 2>&1; then
            echo "a runner job is active, leaving the box up"; exit 0
          fi
          if [ -n "$(docker ps -q --filter 'name=bench-' 2>/dev/null)" ]; then
            echo "a bench container is still running, leaving the box up"; exit 0
          fi
          echo "idle, powering off"
          sudo poweroff
          EOF
          sudo chmod +x /opt/wly/bench-idle.sh
          sudo tee /etc/systemd/system/wly-bench-selfstop.service >/dev/null <<'EOF'
          [Unit]
          Description=Power off the bench box when no sweep is running
          [Service]
          Type=oneshot
          ExecStart=/opt/wly/bench-idle.sh
          EOF
          sudo tee /etc/systemd/system/wly-bench-selfstop.timer >/dev/null <<'EOF'
          [Unit]
          Description=Nightly idle check for the bench box
          [Timer]
          OnCalendar=*-*-* 23:30:00 UTC
          Persistent=false
          [Install]
          WantedBy=timers.target
          EOF
          sudo systemctl daemon-reload
          sudo systemctl enable --now wly-bench-selfstop.timer
          echo "installed. it should report itself busy right now:"
          /opt/wly/bench-idle.sh
          systemctl list-timers wly-bench-selfstop.timer --no-pager | head -3

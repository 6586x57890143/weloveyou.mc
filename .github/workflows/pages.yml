name: pages

# Publish the benchmark results.
#
# Deliberately NOT part of bench.yml. The sweep proposes numbers; a human reads
# them and merges. Publishing keys off that merge, so what reaches the web is
# what someone chose to stand behind, never a raw sweep, and never a screening
# pass that nobody looked at.
#
# Runs on a GitHub-hosted runner, not the bench box. Rendering a page is not a
# measurement, so it has no business competing for the two cores that are, and
# the bench box is powered off almost all the time anyway.
on:
  push:
    branches: [main]
    paths:
      # Glob, so nothing committed to main is invisible. A calibration pass
      # writes BENCHMARKS-calibration.json, which was watched by neither this
      # list nor bench-site.py, so that data could never reach the page.
      - BENCHMARKS*.json
      # A screening pass is 25 profiles; a confirmation pass is the handful of
      # them worth confirming. Watching only the confirmed file meant the
      # broadest data we have could never reach the page. The gate that matters
      # is unchanged: publishing still keys off a HUMAN MERGE to main, never off
      # a sweep finishing, and the page labels a screening section as one run
      # with no variance rather than leaving the reader to remember.
      - scripts/bench-site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: render and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Fail here rather than three steps later inside wrangler, where the error
      # is a Cloudflare API message that says nothing about this repository.
      # These live in weloveyou-pack and have to be copied across; the pack repo
      # and this one publish to two different Pages projects.
      - name: check the credentials exist
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing"
            echo "Copy them from the weloveyou-pack repository, which already has both."
            exit 1
          fi

      - name: render the site
        run: python scripts/bench-site.py --json BENCHMARKS.json --screening BENCHMARKS-screening.json --out site

      # Workers Static Assets, configured in wrangler.jsonc. Uploads only the
      # rendered directory, so Cloudflare is never granted read access to the
      # repository, the same stance as the pack repo's Direct Upload.
      #
      # This replaced `pages deploy`, which failed with 'The Pages project
      # "weloveyou-bench" does not exist' because the `pages project create`
      # before it had quietly failed behind a `|| true`. A static-assets Worker
      # needs no project to exist first, so the whole step disappears rather
      # than getting a retry bolted onto it. Cloudflare recommends Workers for
      # new projects and wrangler says so in its own error message.
      #
      # No accumulator branch: the pack needs one to retain immutable
      # per-version prefixes, whereas every past benchmark is already in git.
      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee /tmp/deploy.log

      - name: summary
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          {
            echo "### benchmarks published"
            echo
            if [ -n "$url" ]; then
              echo "- <$url>"
              echo "- data: <$url/benchmarks.json>"
            else
              echo "Deployed, but no URL appeared in wrangler's output. See the deploy step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: bench

# The JVM flag sweep.
#
# This runs on a SELF-HOSTED runner on the bench box, never on a GitHub-hosted
# one. Hosted runners are noisy shared VMs; Minecraft TPS numbers measured
# there would be fiction, and a committed BENCHMARKS.md full of fiction is
# worse than no file at all.
# DO NOT ADD pull_request OR pull_request_target HERE.
#
# This repository is public and this job runs on a self-hosted runner. A PR
# trigger would let anyone who opens a pull request execute code on the bench
# box. ci.yml enforces this and will fail the build if it is ever added.
on:
  workflow_dispatch:
    inputs:
      workload:
        description: "Which workload to run"
        required: true
        default: both
        type: choice
        # Workload A = vanilla worldgen (control). Workload B = the same run
        # against the real pack. A flag that wins on A and loses on B is a
        # finding, not noise.
        #
        # These must be the strings ParseWorkloads accepts, not the A/B labels:
        # the options used to read [a, b, both], so picking anything but the
        # default failed the sweep on the first command with "unknown workload".
        #
        # `both` and `worldgen` are the two chunk-throughput workloads.
        # `players` is the tick load: carpet fake players exploring, a villager
        # population, and a powered Oritech machine array. Those are what make
        # MSPT mean anything - worldgen barely ticks entities, so TPS reads 20
        # on every profile and the suite cannot see a tick-bound regression.
        #
        # They are also the expensive ones: a fixed 8 minutes of steady state
        # plus warmup each, so run them against the handful of profiles
        # screening liked rather than the whole matrix. `only` takes a list.
        options: [both, worldgen, vanilla, pack, players, explore, village, machines, all]
      runs:
        description: "Repeats per profile, medians are reported, not single runs"
        required: false
        default: "3"
      # The sweep is two passes. 18 profiles at full radius and 3 repeats is
      # roughly 50 hours of a box that bills by the hour, so pass 1 screens the
      # whole matrix cheaply and pass 2 confirms only what looked good:
      #
      #   screening     runs=1 radius=500  out=BENCHMARKS-screening.md
      #   confirmation  runs=3 radius=1000 only=<winner>  out=BENCHMARKS.md
      #
      # These are inputs rather than an edit to this file because the two passes
      # differ only in their arguments, and a workflow edit per pass would be a
      # commit that says nothing.
      radius:
        description: "Chunky pregen radius, 500 to screen, 1000 to confirm"
        required: false
        default: "1000"
      only:
        description: "Comma-separated profiles to run (blank = all enabled)"
        required: false
        default: ""
      # The calibration knob. A tick workload whose load cannot move MSPT p95 is
      # not measuring anything, and how much load this box needs is a property
      # of the box. Raise it until p95 clears the idle floor on the baseline
      # profile, then leave it alone so later rows stay comparable.
      load:
        description: "Scale the tick workloads' entity and machine counts"
        required: false
        default: "1"
      out:
        description: "Output file, use BENCHMARKS-screening.md for a screening pass"
        required: false
        default: BENCHMARKS.md
      # One box takes about seven minutes per run, so 21 profiles across two
      # workloads is most of a night, and a sweep that only fits overnight can
      # only be run overnight. Splitting the matrix across boxes turns wall time
      # into a spend decision, which is the right trade while credits expire
      # unused. Needs that many runners carrying the `bench` label, otherwise
      # the shards simply queue behind each other and nothing is gained.
      shards:
        description: 'JSON list of shards, e.g. ["1/3","2/3","3/3"]. Default runs everything on one box.'
        required: false
        default: '["1/1"]' 
  schedule:
    # Weekly. Frequent enough to catch a JDK or mod bump moving the numbers,
    # rare enough that the box is mostly available for playing on.
    - cron: "0 4 * * 1"

# contents: write, to push the results branch. `contents: read` was enough while
# the sweep had never run; the first real run died with "Permission to ... denied
# to github-actions[bot]" after the measurement was already done, throwing the
# numbers away.
#
# Deliberately NOT pull-requests: write. Opening a PR from Actions also needs
# "Allow GitHub Actions to create and approve pull requests" enabled
# repository-wide, and loosening that on a public repository to save one click
# is the wrong trade. The sweep proposes; a human opens and merges.
permissions:
  contents: write

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  sweep:
    name: jvm sweep ${{ matrix.shard }}
    runs-on: [self-hosted, bench]
    timeout-minutes: 720
    strategy:
      # fail-fast off: one shard dying should not throw away the measurements
      # the others already paid for.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event.inputs.shards || '["1/1"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: run the sweep
        env:
          OUT: ${{ github.event.inputs.out || 'BENCHMARKS.md' }}
        run: |
          go run ./cmd/wly bench \
            --workload "${{ github.event.inputs.workload || 'both' }}" \
            --runs "${{ github.event.inputs.runs || '3' }}" \
            --radius "${{ github.event.inputs.radius || '1000' }}" \
            --load "${{ github.event.inputs.load || '1' }}" \
            --only "${{ github.event.inputs.only || '' }}" \
            --out "$OUT" \
            --json "${OUT%.md}.json" \
            --shard "${{ matrix.shard }}" \
            --raw shard.json

      # Each shard hands its raw measurements to the merge job rather than
      # pushing its own branch: several boxes pushing at once would race, and
      # the table has to be rendered from all of them together for the baseline
      # comparison to mean anything.
      - name: hand this shard's results to the merge job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-${{ strategy.job-index }}
          path: shard.json
          if-no-files-found: warn
          retention-days: 3

      # Always, including on failure: a crashed sweep that leaves the box running
      # costs more than the sweep did. An in-guest poweroff transitions the OCI
      # instance to STOPPED, which is what actually stops the billing - only the
      # boot volume is charged after that.
      #
      # A timer on the production box brings it back 15 minutes before the next
      # scheduled sweep, and a nightly one stops it if this step never ran.
      - name: power down the bench box
        if: always()
        run: |
          echo "sweep finished; powering off to stop billing"
          sudo shutdown -h +1 "bench sweep complete" || sudo poweroff

  # Rendering a table is not a measurement, so it has no business competing for
  # the two cores that are. This also keeps the git push in one place: with
  # several shards running, each pushing its own branch would race.
  merge:
    name: merge and publish
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v7
        with:
          pattern: shard-*
          path: shards

      - name: combine the shards
        env:
          OUT: ${{ github.event.inputs.out || 'BENCHMARKS.md' }}
        run: |
          set -euo pipefail
          files=$(find shards -name 'shard.json' | paste -sd, -)
          if [ -z "$files" ]; then
            echo "::warning::no shard produced results; nothing to merge"
            exit 0
          fi
          echo "merging: $files"
          go run ./cmd/wly bench --merge "$files" \
            --out "$OUT" --json "${OUT%.md}.json"

      - name: is this sweep fit to publish
        id: gate
        env:
          OUT: ${{ github.event.inputs.out || 'BENCHMARKS.md' }}
        run: |
          set -uo pipefail
          files=$(find shards -name 'shard.json' | paste -sd, -)
          if [ -z "$files" ]; then
            echo "verdict=empty" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Structural problems only: a sweep measured on two machines, against
          # two packs, or with a dead baseline is misleading as a whole. A
          # single profile that crashed is a finding, renders as FAILED, and
          # still publishes.
          if go run ./cmd/wly bench --validate "$files" 2>&1 | tee /tmp/validate.txt; then
            echo "verdict=publish" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=hold" >> "$GITHUB_OUTPUT"
          fi

      # The results go straight to main and pages.yml picks them up from there.
      # This used to push a branch and print a compare link for a human to open
      # and merge, and the reported findings simply never got merged - so the
      # site served "No results yet" while four sweeps sat on branches nobody
      # looked at. The gate above is what replaced the human.
      - name: publish
        if: steps.gate.outputs.verdict == 'publish'
        env:
          OUT: ${{ github.event.inputs.out || 'BENCHMARKS.md' }}
        run: |
          set -euo pipefail
          JSON="${OUT%.md}.json"
          # --porcelain, not `git diff`: a screening pass writes a file that is
          # not tracked yet, and `git diff` cannot see an untracked file.
          if [ -z "$(git status --porcelain -- "$OUT" "$JSON")" ]; then
            echo "the numbers did not move; nothing to publish"
            exit 0
          fi
          # actions/checkout leaves a detached HEAD, so base the commit on
          # current main explicitly. Switching carries the generated files over
          # as working-tree changes.
          git fetch --quiet origin main
          git switch -c publish origin/main
          git add -- "$OUT" "$JSON"
          git -c user.name=bench -c user.email=bench@local commit -m "bench: refresh $OUT"             -m "Sweep ${GITHUB_RUN_ID}, harness ${GITHUB_SHA}."
          # One retry: a doc change landing between the fetch and the push is
          # ordinary, and losing a whole sweep to it would not be.
          git push origin HEAD:main || {
            git pull --rebase origin main
            git push origin HEAD:main
          }
          {
            echo "### published"
            echo
            echo "\`$OUT\` is on main; pages.yml deploys it from there."
            echo
            echo "Anything under ~5% is noise. A screening pass (runs=1) has no"
            echo "variance and must not be read next to confirmed numbers."
          } >> "$GITHUB_STEP_SUMMARY"

      # A sweep that failed the gate still leaves its evidence somewhere, so the
      # numbers can be read and the cause found. It just never reaches the page.
      - name: park the results when the gate says no
        if: steps.gate.outputs.verdict == 'hold'
        env:
          OUT: ${{ github.event.inputs.out || 'BENCHMARKS.md' }}
        run: |
          set -euo pipefail
          JSON="${OUT%.md}.json"
          branch="bench/held-$(date -u +%Y%m%d-%H%M)"
          git switch -c "$branch"
          git add -- "$OUT" "$JSON" 2>/dev/null || true
          git -c user.name=bench -c user.email=bench@local             commit -m "bench: HELD, $OUT did not pass validation" || true
          git push origin "$branch" || true
          {
            echo "### not published"
            echo
            echo "The sweep produced numbers that would mislead, so they were"
            echo "parked on \`$branch\` instead of going to main:"
            echo
            echo '```'
            cat /tmp/validate.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

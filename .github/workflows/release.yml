name: release

# Tag-driven. `git tag v1.2.3 && git push origin v1.2.3` produces a GitHub
# Release with a wlyup binary per platform, a SHA256SUMS file, and a multi-arch
# wly image on ghcr.io.
#
# Third-party actions are deliberately avoided outside of actions/* : this
# workflow has write access to the repository and the registry, so every action
# it runs is part of this project's supply chain. Everything else is plain CLI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: scripts/coverage.sh

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
          - { goos: linux,   goarch: amd64, ext: "" }
          - { goos: linux,   goarch: arm64, ext: "" }
          - { goos: darwin,  goarch: amd64, ext: "" }
          - { goos: darwin,  goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="wlyup_${TAG}_${GOOS}_${GOARCH}${{ matrix.ext }}"
          mkdir -p dist
          # -trimpath and an empty -buildid are what make the output
          # reproducible: the same source and tag yield identical bytes, so a
          # third party can rebuild and compare rather than trusting this runner.
          go build -trimpath \
            -ldflags="-s -w -buildid= -X weloveyou-mc/internal/buildinfo.version=${TAG} -X weloveyou-mc/internal/buildinfo.commit=${GITHUB_SHA}" \
            -o "dist/${NAME}" ./cmd/wlyup
          (cd dist && sha256sum "${NAME}" > "${NAME}.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: wlyup-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: staging
          merge-multiple: true
      - name: collect and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find staging -type f ! -name '*.sha256' -exec mv {} dist/ \;
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NOTES=$(mktemp)
          {
            echo "## wlyup ${TAG}"
            echo
            echo "The weloveyou pack updater. Single static binary — no Java, no launcher"
            echo "plugin. It reads the published packwiz index and brings your install in"
            echo "line with it."
            echo
            echo "### Install"
            echo
            echo '```'
            echo "# Windows"
            echo "wlyup_${TAG}_windows_amd64.exe"
            echo "# Linux / macOS"
            echo "chmod +x wlyup_${TAG}_linux_amd64 && ./wlyup_${TAG}_linux_amd64"
            echo '```'
            echo
            echo "### Verify"
            echo
            echo "Every asset is listed in \`SHA256SUMS\`. Builds use \`-trimpath\` and an"
            echo "empty \`-buildid\`, so rebuilding this tag with the same Go version"
            echo "reproduces the same bytes:"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS"
            echo '```'
            echo
            echo "\`wlyup\` rewrites your mods folder to match the pack. Point it at a copy"
            echo "first if you have local changes you care about."
          } > "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "wlyup ${TAG}" \
              --notes-file "$NOTES" \
              --verify-tag
          fi

  image:
    name: publish image
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: set up buildx
        run: docker buildx create --use --name wly-builder
      - name: log in to ghcr
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build and push
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          REPO=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          docker buildx build \
            -f deploy/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${TAG}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${TAG}" \
            --tag "${REPO}:${TAG}" \
            --tag "${REPO}:latest" \
            --provenance=true \
            --sbom=true \
            --push .

  # Only wly and compose changes reach the box. A pack release does not deploy
  # anything: the pack lives in R2 and wly restarts the server to pick it up.
  #
  # The box is reachable only over the tailnet — its deploy key carries
  # from="100.64.0.0/10,...", so a connection from a public runner IP is refused
  # even with the right key. So the runner joins the tailnet, deploys, and leaves.
  #
  # What the runner can actually do on the box is deliberately tiny: the deploy
  # key is a forced command, so this SSH invocation cannot run anything except
  # /opt/deploy/deploy.sh, which accepts "deploy [ref]" and nothing else. Even a
  # fully compromised workflow cannot get a shell there.
  deploy:
    name: deploy to the server
    needs: [publish, image]
    runs-on: ubuntu-latest
    # Skipped rather than failed when the box is not configured, so early
    # releases can happen before any of this exists.
    if: vars.DEPLOY_HOST != ''
    environment: production
    steps:
      # Tailscale's own apt repository, verified by their signing key — not a
      # third-party action. This workflow holds contents:write and packages:write,
      # so everything it runs is part of this project's supply chain.
      - name: install tailscale
        run: |
          set -euo pipefail
          codename=$(lsb_release -cs)
          base="https://pkgs.tailscale.com/stable/ubuntu"
          curl -fsSL "$base/${codename}.noarmor.gpg" | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL "$base/${codename}.tailscale-keyring.list" | sudo tee /etc/apt/sources.list.d/tailscale.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq tailscale
          tailscale --version

      # userspace-networking avoids needing a TUN device or NET_ADMIN, and
      # --state=mem: keeps the node identity off the runner disk entirely.
      - name: join the tailnet
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -euo pipefail
          test -n "${TS_AUTHKEY:-}" || { echo "::error::TS_AUTHKEY is not set"; exit 1; }
          sudo tailscaled --state=mem: --tun=userspace-networking --socks5-server=localhost:1055 &
          # The key must be ephemeral and tagged. Ephemeral so this node removes
          # itself when the run ends rather than accumulating dead machines, and
          # tagged so the ACL can permit it to reach exactly one host on one port.
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="gh-runner-${GITHUB_RUN_ID}" --accept-routes=false --accept-dns=false --ssh=false
          sudo tailscale status

      - name: deploy
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          install -m 600 /dev/null key
          install -m 600 /dev/null known_hosts
          echo "$KEY" > key
          echo "$KNOWN_HOSTS" > known_hosts

          # StrictHostKeyChecking=yes, never accept-new: this runs unattended
          # against a box that can restart the game server, so an unrecognised
          # host key must abort rather than be trusted on faith.
          #
          # `tailscale nc` rather than netcat with -X 5: it is guaranteed present
          # alongside tailscaled and needs no assumption about which netcat the
          # runner image ships.
          ssh -i key \
              -o UserKnownHostsFile=known_hosts \
              -o StrictHostKeyChecking=yes \
              -o ProxyCommand="sudo tailscale nc %h %p" \
              -o ConnectTimeout=30 \
              "${USER}@${HOST}" "deploy ${TAG}"

      # Ephemeral keys expire on their own, but logging out makes the node
      # disappear immediately rather than after Tailscale's timeout.
      - name: leave the tailnet
        if: always()
        run: sudo tailscale logout || true
